name: 24/7 Auto Watchdog

on:
  schedule:
    # Run every 30 minutes to ensure continuous 24/7 operation
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-and-revive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check Main Server Status
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TOKEN="${PAT_TOKEN}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          echo "🔍 Checking active workflow runs for repository: ${{ github.repository }}..."

          # Query GitHub API for in_progress runs of main.yml
          RUNS_JSON=$(curl -s -H "Accept: application/vnd.github+v3" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/runs?status=in_progress")

          TOTAL_RUNS=$(echo "$RUNS_JSON" | jq -r '.total_count // 0')
          echo "Active running sessions: $TOTAL_RUNS"

          QUEUED_JSON=$(curl -s -H "Accept: application/vnd.github+v3" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/runs?status=queued")
          QUEUED_RUNS=$(echo "$QUEUED_JSON" | jq -r '.total_count // 0')
          echo "Queued sessions: $QUEUED_RUNS"

          if [ "$TOTAL_RUNS" -gt 0 ] || [ "$QUEUED_RUNS" -gt 0 ]; then
            echo "✅ Server workflow is already actively running. No action required."
            exit 0
          fi

          echo "⚠️ No active runner detected! Server might have stopped or timed out."
          echo "🚀 Automatically triggering main.yml to restore 24/7 service..."

          BRANCH="${{ github.ref_name }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi

          DISPATCH_STATUS=$(curl -s -w "%{http_code}" -o /tmp/auto_dispatch.txt -X POST \
            -H "Accept: application/vnd.github+v3" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches" \
            -d "{\"ref\":\"${BRANCH}\"}")

          echo "Dispatch HTTP status: $DISPATCH_STATUS"
          if [ "$DISPATCH_STATUS" = "204" ]; then
            echo "🎉 Successfully revived Xray 24/7 server via Watchdog!"
          else
            echo "❌ Failed to trigger workflow (Code $DISPATCH_STATUS):"
            cat /tmp/auto_dispatch.txt
            exit 1
          fi
